# Production stack: the GHCR image plus Postgres.
#
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# (In the Portainer stack the environment comes from the UI, not a .env file.)

name: weddingwebsite

services:
  web:
    image: ghcr.io/soccerbeats/weddingwebsite:latest
    container_name: wedding-web-prod
    restart: always
    # Published to every interface, not loopback — and that is deliberate, not
    # an oversight. Nginx Proxy Manager reaches this port through its own
    # Docker bridge network, routed by the host between the two bridges, so
    # its traffic never arrives on loopback: binding this to 127.0.0.1 makes
    # Docker's NAT rule stop matching the proxy's own traffic too (confirmed
    # live — the site 502'd through the proxy until reverted). The port is
    # kept off the LAN instead by a host firewall rule on docker-server
    # (/usr/local/sbin/docker-portguard.sh, in the DOCKER-USER chain Docker
    # never rewrites, matched on the original destination port so it survives
    # this container's IP changing on every recreate).
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NODE_ENV=production
      # Optional, and all `:-` so an unset one is an empty string rather than a
      # compose warning. Each feature checks its own var and says so in the UI
      # when it is missing, so leaving any of these blank is a supported state.
      - JWT_SECRET=${JWT_SECRET:-}
      # The GitHub repo the admin panel checks for updates (owner/name). Only a
      # fork that publishes its own image needs it; blank means the original.
      - UPDATE_REPO=${UPDATE_REPO:-}
      # RapidAPI key for AeroDataBox — turns on "Fill in from schedule" on a
      # honeymoon travel leg. Without it the button explains itself.
      - FLIGHT_API_KEY=${FLIGHT_API_KEY:-}
      - FLIGHT_API_HOST=${FLIGHT_API_HOST:-}
      # A private OSRM, if you ever run one. Defaults to the public demo server.
      - OSRM_URL=${OSRM_URL:-}
      # RSVP email notifications.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - GEOCODER_USER_AGENT=${GEOCODER_USER_AGENT:-}
      - NOMINATIM_URL=${NOMINATIM_URL:-}
    volumes:
      - photos_data:/app/public/photos
      - config_data:/app/public/config
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: wedding-db-prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  photos_data:
  config_data:
