# The public demo instance.
#
# A second, completely separate stack: its own database, its own volumes, its own
# port. It shares nothing with production but the image, so nothing done in the
# demo can reach the real guest list — which is the whole reason it exists as a
# stack rather than as a "demo mode" inside the running site.
#
# It seeds itself, on every start. The one-shot `seed` service waits for the
# database, wipes it and fills the demo — the fictional wedding, the photos, the
# budget, the seating, the honeymoon — writing the config and photos straight
# into the demo volumes. Reseeding every time is safe *because* this instance is
# immutable (DEMO_MODE below): no visitor's work is ever kept, so there is
# nothing to preserve, and a fresh seed is how the demo gains the data for
# features that shipped since the last deploy. Drop `SEED_ALWAYS` and the seeder
# reverts to filling only an empty database.
#
#   docker compose -f docker/docker-compose.demo.yml up -d
#
# The seed image (ghcr.io/soccerbeats/weddingwebsite-seeder:latest) is the
# "seeder" stage of docker/Dockerfile, published by the "Demo Instance"
# workflow on every push to main. To seed by hand instead, run the seed in a
# throwaway container: `npm run seed:demo -- --yes-wipe` (destructive by
# design, refuses to run without the flag).
#
# Postgres is deliberately NOT published to the host. The demo is meant to be
# reachable by anyone, its password is `demo`, and a published database port
# would let a visitor write to it directly with psql — straight past DEMO_MODE,
# which only guards the application. The seed runs inside the stack and reaches
# the database over the compose network, so nothing needs the port.

# `name` pins the project, so the stack keeps the name the old `-p weddingdemo`
# flag gave it.
name: weddingdemo

services:
  web:
    image: ghcr.io/soccerbeats/weddingwebsite:latest
    container_name: wedding-web-demo
    restart: always
    ports:
      - '3001:3000'
    environment:
      - DATABASE_URL=postgresql://demo:demo@db:5432/demo
      # Read-only for everyone: no login, and no write is ever persisted. See
      # src/lib/demo.ts — the flag is also refused unless the database is the
      # demo's, which the DATABASE_URL above satisfies.
      - DEMO_MODE=true
      # Vestigial while DEMO_MODE holds — there is no login page to type it
      # into. Kept so that if the flag is ever refused, this instance falls back
      # to *asking for a password* rather than standing wide open.
      - ADMIN_PASSWORD=demo
      - NODE_ENV=production
    volumes:
      - demo_photos:/app/public/photos
      - demo_config:/app/public/config
    depends_on:
      - db

  # One-shot. Runs on every `up`, exits after one pass. It mounts the same
  # config and photo volumes as the web service, so what it writes is what
  # the site serves — no docker cp step. See the seeder stage of the
  # Dockerfile for what the entrypoint does (and when it refuses to).
  seed:
    image: ghcr.io/soccerbeats/weddingwebsite-seeder:latest
    container_name: wedding-seed-demo
    environment:
      - DATABASE_URL=postgresql://demo:demo@db:5432/demo
      - CONFIG_DIR=/data/config
      - PHOTO_DIR=/data/photos
      # Reseed on every start, rather than only when the database is empty:
      # this instance is immutable, so there is no visitor's work to protect —
      # and a fresh seed is how the demo picks up the data for features that
      # shipped since it was last deployed.
      - SEED_ALWAYS=true
    volumes:
      - demo_config:/data/config
      - demo_photos:/data/photos
    depends_on:
      - db
    restart: 'no'

  db:
    image: postgres:15-alpine
    container_name: wedding-db-demo
    restart: always
    # No `ports:` — see the note at the top. Reachable only from inside the
    # stack, which is all the web and seed services need.
    environment:
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo
      - POSTGRES_DB=demo
    volumes:
      - demo_postgres:/var/lib/postgresql/data

volumes:
  demo_postgres:
  demo_photos:
  demo_config:
