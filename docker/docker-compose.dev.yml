# Development stack — source mounted, `npm run dev`, Postgres alongside.
#
# Run from the repository root:
#
#   cp docker/.env.example docker/.env   # once, then edit
#   docker compose -f docker/docker-compose.dev.yml up -d
#
# Compose reads .env from this directory (the compose file's directory), and
# the relative paths below resolve from it too, so the source tree is `..`.
# `name` pins the project, so existing volumes keep the names older
# installs used (a file in docker/ would otherwise name the project "docker").

name: weddingwebsite

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    container_name: wedding-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NODE_ENV=${NODE_ENV}
    volumes:
      - ../:/app
      - /app/node_modules
      - photos_data:/app/public/photos
      - config_data:/app/public/config
    depends_on:
      - db
    command: npm run dev

  db:
    image: postgres:15-alpine
    container_name: wedding-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
  photos_data:
  config_data:
