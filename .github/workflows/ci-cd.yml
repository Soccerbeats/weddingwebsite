# CI/CD for the wedding website.
#
# On every push to a tracked branch (and every pull request) this:
#   1. Installs dependencies and runs a real `next build`, so a broken
#      commit is caught before anyone has to docker-build it by hand.
#   2. Runs the changelog format check (CHANGELOG.md is the source of
#      truth for the app version, so its shape is part of the contract).
#   3. Builds the production Docker image (same `--target production`
#      that deploy.md prescribes).
#
# Publishing to the registry:
#   - Pull requests (including from forks): image is built but never
#     pushed — no credentials are needed for a PR run.
#   - Pushes to `main` and `v*` tags: the image is pushed to GitHub
#     Container Registry as
#         ghcr.io/soccerbeats/weddingwebsite:latest   (main only)
#         ghcr.io/soccerbeats/weddingwebsite:v<CHANGELOG version>
#         ghcr.io/soccerbeats/weddingwebsite:sha-<short sha>
#     The version comes from the topmost vX.Y.Z heading in CHANGELOG.md,
#     mirroring how the admin panel decides which version it is.
#
# The Portainer stack keeps pointing at ...:latest, so deployments stay
# a "pull and redeploy" as before — except the image now appears here
# automatically after a merge instead of from a laptop.

name: "Wedding Planner"

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

# One run per branch at a time; a stale build is replaced by a fresh one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "Wedding Planner · check the build"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The same build the Dockerfile runs. If this fails, the image
      # would not have built either — but we find out faster and with
      # no registry involved.
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Enforces the changelog conventions (unique, descending,
      # version-stamped entries) that `npm run check:changelog` documents.
      - name: Changelog check
        run: npm run check:changelog

  docker:
    name: "Wedding Planner · pack & publish the image"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Work out the image tags
        id: meta
        run: |
          set -euo pipefail
          # Topmost "## vX.Y.Z —" heading is the current version.
          VERSION="$(sed -n 's/^## v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\) —.*/\1/p' CHANGELOG.md | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read a vX.Y.Z version from CHANGELOG.md"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="ghcr.io/soccerbeats/weddingwebsite"
          TAGS="$IMAGE:sha-$SHORT_SHA,$IMAGE:v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Two separate decisions, deliberately not one condition: whether to
          # publish at all, and whether `latest` moves.
          #
          # `latest` is the tag Portainer pulls, and only main may move it. A
          # tag is how you mark a *past* release — `git tag v0.9.5 <old sha>` —
          # and if that moved `latest` too, the next pull in Portainer would
          # quietly deploy old code, from an action nobody expects to touch
          # production.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF" in
              refs/heads/main)
                TAGS="$TAGS,$IMAGE:latest"
                echo "push=true" >> "$GITHUB_OUTPUT"
                ;;
              refs/tags/v*)
                echo "push=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE — version v$VERSION (sha $SHORT_SHA)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only main pushes and v* tags publish anything, so pull-request
      # runs (even from forks) need no credentials at all.
      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          # The Dockerfile lives in docker/ (the "Docker files move into
          # docker/" PR); the build context stays at the repository root.
          file: docker/Dockerfile
          # Same target deploy.md always uses for the production image.
          target: production
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Cache the npm install and Next.js build layers between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Tell Portainer to pull the image it was just handed and swap the container,
  # so a merge to main reaches the running site without anyone pressing a
  # button.
  #
  # A webhook, deliberately, and not SSH. A redeploy webhook is a single URL
  # whose only power is "re-pull this one stack"; an SSH key in CI is the power
  # to run anything on a box that also hosts production, handed to anyone who
  # can land a commit on a public repository. The earlier draft of the demo
  # workflow did the latter and was dropped for exactly this reason.
  redeploy:
    name: "Wedding Planner · tell Portainer to redeploy"
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 10
    # Only a push to main publishes :latest, so only a push to main has
    # anything new for Portainer to pull. A tag deliberately does not redeploy:
    # tagging an old commit must never move production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The URLs live in job-level env because `secrets` cannot be read from a
    # job-level `if:` — only `github`, `needs`, `vars` and `inputs` are in scope
    # there. Step-level `if:` can read `env`, which is how the steps below skip
    # cleanly when a webhook has not been configured.
    env:
      PORTAINER_PROD_WEBHOOK: ${{ secrets.PORTAINER_PROD_WEBHOOK }}
      PORTAINER_OVH_WEBHOOK: ${{ secrets.PORTAINER_OVH_WEBHOOK }}
    steps:
      - name: Redeploy production
        if: env.PORTAINER_PROD_WEBHOOK != ''
        run: |
          # Three attempts: a redeploy webhook does real work (pull, recreate)
          # and Portainer occasionally takes longer than the default timeout on
          # a cold pull. Never print the URL — it is the credential.
          for attempt in 1 2 3; do
            CODE=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 300 \
              -X POST "$PORTAINER_PROD_WEBHOOK" || echo 000)
            case "$CODE" in
              2*) echo "Production redeploy accepted (HTTP $CODE)."; exit 0 ;;
            esac
            echo "::warning::Attempt $attempt failed (HTTP $CODE): $(cat /tmp/body)"
            sleep 15
          done
          echo "::error::Production redeploy never succeeded. The image IS published — redeploy by hand in Portainer. A 404 with \"Unable to find the stack by webhook ID\" means the token no longer exists: re-enable the webhook on the stack, press Update the stack, and reset the PORTAINER_PROD_WEBHOOK secret."
          exit 1

      - name: Redeploy the OVH instance
        if: env.PORTAINER_OVH_WEBHOOK != ''
        run: |
          for attempt in 1 2 3; do
            CODE=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 300 \
              -X POST "$PORTAINER_OVH_WEBHOOK" || echo 000)
            case "$CODE" in
              2*) echo "OVH redeploy accepted (HTTP $CODE)."; exit 0 ;;
            esac
            echo "::warning::Attempt $attempt failed (HTTP $CODE): $(cat /tmp/body)"
            sleep 15
          done
          echo "::error::OVH redeploy never succeeded."
          exit 1

      - name: Say what was not configured
        if: env.PORTAINER_PROD_WEBHOOK == '' || env.PORTAINER_OVH_WEBHOOK == ''
        run: |
          # A skipped redeploy must not look like a successful one. Without this
          # the job goes green having done nothing at all.
          if [ -z "$PORTAINER_PROD_WEBHOOK" ]; then
            echo "::warning::No PORTAINER_PROD_WEBHOOK secret — production was NOT redeployed. Set it with: gh secret set PORTAINER_PROD_WEBHOOK"
          fi
          if [ -z "$PORTAINER_OVH_WEBHOOK" ]; then
            echo "::notice::No PORTAINER_OVH_WEBHOOK secret. The OVH box is a Portainer *edge* environment, which has no per-stack webhook, so it updates itself instead — see demo-autoupdate.timer on that host."
          fi
